<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiter · Good Vibes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --green:  #2d6a4f;
  --green2: #52b788;
  --yellow: #f4a261;
  --dark:   #0f1923;
  --card:   #1a2535;
  --border: rgba(255,255,255,0.08);
  --text:   #e8f0e8;
  --muted:  rgba(255,255,255,0.4);
}

body { font-family:'Nunito',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }

/* TOP BAR */
.topbar {
  background: linear-gradient(135deg,#1B4332,#2D6A4F);
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top:0; z-index:100;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}
.topbar-left { display:flex; align-items:center; gap:10px; }
.back-btn {
  background:rgba(255,255,255,0.1); border:none; color:#fff;
  width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:18px;
  display:flex; align-items:center; justify-content:center;
  text-decoration:none;
}
.topbar-title { font-family:'Bebas Neue'; font-size:22px; letter-spacing:2px; color:#fff; line-height:1; }
.topbar-sub { font-size:11px; color:rgba(255,255,255,0.5); }

.cart-btn {
  position:relative; background:var(--yellow); border:none;
  color:#1a1a2e; padding:8px 16px; border-radius:12px;
  font-weight:800; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.cart-count {
  background:#e63946; color:#fff; width:20px; height:20px;
  border-radius:50%; font-size:11px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
  position:absolute; top:-8px; right:-8px;
}

/* TABLE SELECTOR SCREEN */
#table-screen {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; min-height:100vh; padding:24px; gap:24px;
}
.table-logo { text-align:center; }
.table-logo .big { font-family:'Bebas Neue'; font-size:52px; color:#fff; letter-spacing:3px; line-height:1; }
.table-logo .big span { color:var(--yellow); }
.table-logo .sub { font-size:12px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-top:4px; }

.table-prompt { font-size:18px; font-weight:800; color:var(--text); text-align:center; }
.table-prompt span { color:var(--green2); }

.table-grid {
  display:grid; grid-template-columns:repeat(5, 1fr);
  gap:10px; width:100%; max-width:380px;
}
.table-btn {
  aspect-ratio:1; background:var(--card); border:1.5px solid var(--border);
  border-radius:14px; cursor:pointer; font-size:18px; font-weight:900;
  color:var(--text); transition:all 0.15s; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.table-btn:hover { background:#243040; border-color:var(--green2); color:var(--green2); transform:scale(1.05); }
.table-btn .t-label { font-size:10px; font-weight:600; color:var(--muted); }
.table-btn.occupied { border-color:var(--yellow); color:var(--yellow); }

/* MENU SCREEN */
#menu-screen { display:none; }

.table-badge {
  background:rgba(82,183,136,0.15); border:1px solid var(--green2);
  color:var(--green2); padding:4px 12px; border-radius:20px;
  font-size:12px; font-weight:700;
}

/* Search */
.search-wrap { padding:12px 16px; }
.search-input {
  width:100%; background:var(--card); border:1.5px solid var(--border);
  border-radius:12px; padding:10px 16px 10px 40px; color:var(--text);
  font-family:inherit; font-size:14px; outline:none;
  transition:border-color 0.2s;
}
.search-input:focus { border-color:var(--green2); }
.search-wrap { position:relative; }
.search-icon { position:absolute; left:28px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }

/* Category pills */
.cats {
  display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px;
  scrollbar-width:none;
}
.cats::-webkit-scrollbar { display:none; }
.cat-pill {
  flex-shrink:0; padding:6px 14px; border-radius:20px;
  background:var(--card); border:1.5px solid var(--border);
  color:var(--muted); font-size:12px; font-weight:700;
  cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.cat-pill.active, .cat-pill:hover { background:var(--green); border-color:var(--green2); color:#fff; }

/* Menu grid */
.menu-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; padding:0 16px 120px;
}

.menu-item {
  background:var(--card); border:1.5px solid var(--border);
  border-radius:16px; padding:14px 12px; cursor:pointer;
  transition:all 0.15s; position:relative; overflow:hidden;
}
.menu-item:hover { border-color:rgba(82,183,136,0.4); transform:translateY(-2px); }
.menu-item.in-cart { border-color:var(--green2); background:#1a2e25; }

.item-emoji { font-size:32px; display:block; margin-bottom:6px; line-height:1; }
.item-name { font-size:13px; font-weight:800; color:var(--text); line-height:1.3; margin-bottom:4px; }
.item-price { font-size:14px; font-weight:900; color:var(--yellow); }

.item-controls {
  display:flex; align-items:center; gap:6px; margin-top:8px;
}
.qty-btn {
  width:28px; height:28px; border-radius:8px; border:none; cursor:pointer;
  font-size:16px; font-weight:900; display:flex; align-items:center; justify-content:center;
  transition:opacity 0.15s;
}
.qty-btn.minus { background:rgba(230,57,70,0.2); color:#e63946; }
.qty-btn.plus  { background:rgba(82,183,136,0.2); color:var(--green2); }
.qty-num { font-weight:900; font-size:15px; color:#fff; min-width:20px; text-align:center; }

.cat-section-title {
  grid-column:1/-1; font-family:'Bebas Neue'; font-size:20px;
  letter-spacing:2px; color:var(--green2); padding-top:8px;
  border-bottom:1px solid var(--border); padding-bottom:6px;
}

/* CART DRAWER */
.drawer-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.6);
  z-index:200; display:none; backdrop-filter:blur(4px);
}
.drawer-overlay.open { display:block; }
.drawer {
  position:fixed; bottom:0; left:0; right:0; max-height:80vh;
  background:#131e2b; border-radius:24px 24px 0 0; z-index:201;
  transform:translateY(100%); transition:transform 0.3s ease;
  display:flex; flex-direction:column;
}
.drawer.open { transform:translateY(0); }

.drawer-handle {
  width:40px; height:4px; background:rgba(255,255,255,0.2);
  border-radius:2px; margin:12px auto 0;
}
.drawer-header {
  padding:16px 20px 12px; display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--border);
}
.drawer-title { font-family:'Bebas Neue'; font-size:22px; letter-spacing:1px; }
.drawer-close {
  background:var(--card); border:none; color:var(--muted);
  width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:18px;
}

.drawer-body { overflow-y:auto; flex:1; padding:12px 20px; }
.cart-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border);
}
.cart-row:last-child { border-bottom:none; }
.cart-item-name { font-weight:700; font-size:14px; }
.cart-item-meta { font-size:12px; color:var(--muted); }
.cart-item-price { font-weight:900; color:var(--yellow); font-size:14px; }

.drawer-footer {
  padding:16px 20px; border-top:1px solid var(--border);
  background:#131e2b;
}
.total-row {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.total-label { font-size:16px; font-weight:800; }
.total-amount { font-size:24px; font-weight:900; color:var(--yellow); }

.send-btn {
  width:100%; padding:16px; background:linear-gradient(135deg,var(--green),var(--green2));
  border:none; border-radius:16px; color:#fff; font-family:'Nunito';
  font-size:16px; font-weight:900; cursor:pointer; letter-spacing:0.5px;
  transition:opacity 0.2s;
}
.send-btn:hover { opacity:0.9; }
.send-btn:disabled { opacity:0.5; cursor:default; }

/* SUCCESS TOAST */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--green); color:#fff; padding:14px 28px; border-radius:16px;
  font-weight:800; font-size:15px; z-index:999; transition:transform 0.3s ease;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.toast.show { transform:translateX(-50%) translateY(0); }

@media(max-width:360px) {
  .menu-grid { grid-template-columns:1fr; }
  .table-grid { grid-template-columns:repeat(4,1fr); }
}
</style>
</head>
<body>

<!-- TABLE SELECT SCREEN -->
<div id="table-screen">
  <div class="table-logo">
    <div class="big">GOOD <span>VIBES</span></div>
    <div class="sub">Farm Stay · Waiter Portal</div>
  </div>
  <div class="table-prompt">Select a <span>Table Number</span></div>
  <div class="table-grid" id="tableGrid"></div>
</div>

<!-- MENU SCREEN -->
<div id="menu-screen">
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="goBack()">←</button>
      <div>
        <div class="topbar-title">Good Vibes</div>
        <div class="topbar-sub">Waiter · <span id="tableLabel">Table —</span></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="table-badge" id="tableBadge">T—</div>
      <button class="cart-btn" onclick="openCart()">
        🛒 Cart
        <div class="cart-count" id="cartCount" style="display:none">0</div>
      </button>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="Search menu items..." oninput="renderMenu()">
  </div>

  <div class="cats" id="catPills"></div>
  <div class="menu-grid" id="menuGrid"></div>
</div>

<!-- CART DRAWER -->
<div class="drawer-overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <div class="drawer-title" id="drawerTitle">Your Order</div>
    <button class="drawer-close" onclick="closeCart()">×</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-footer">
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-amount" id="cartTotal">Rs. 0</span>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendOrder()">
      🍳 Send Order to Kitchen
    </button>
  </div>
</div>

<div class="toast" id="toast">✅ Order sent to kitchen!</div>

<script src="../shared.js"></script>
<script>
let selectedTable = null;
let cart = {}; // { itemId: quantity }
let activeCategory = 'All';

// Build table grid
function buildTableGrid() {
  const grid = document.getElementById('tableGrid');
  const orders = GV.getOrders().filter(o => o.status !== 'paid');
  const occupiedTables = new Set(orders.map(o => o.table));
  grid.innerHTML = '';
  for (let i = 1; i <= 20; i++) {
    const btn = document.createElement('button');
    btn.className = 'table-btn' + (occupiedTables.has(String(i)) ? ' occupied' : '');
    btn.innerHTML = `<span>${i}</span><span class="t-label">${occupiedTables.has(String(i)) ? 'Active' : 'Free'}</span>`;
    btn.onclick = () => selectTable(i);
    grid.appendChild(btn);
  }
}

function selectTable(n) {
  selectedTable = String(n);
  document.getElementById('tableLabel').textContent = 'Table ' + n;
  document.getElementById('tableBadge').textContent = 'T' + n;
  document.getElementById('table-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'block';
  buildCategoryPills();
  renderMenu();
}

function goBack() {
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('table-screen').style.display = 'flex';
  buildTableGrid();
}

// Category pills
function buildCategoryPills() {
  const cats = ['All', ...GV.categories()];
  const wrap = document.getElementById('catPills');
  wrap.innerHTML = cats.map(c =>
    `<div class="cat-pill ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</div>`
  ).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  buildCategoryPills();
  renderMenu();
}

// Render menu
function renderMenu() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let items = GV.menu;
  if (activeCategory !== 'All') items = items.filter(i => i.cat === activeCategory);
  if (q) items = items.filter(i => i.name.toLowerCase().includes(q));

  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';

  // Group by category if showing all
  if (activeCategory === 'All' && !q) {
    GV.categories().forEach(cat => {
      const catItems = items.filter(i => i.cat === cat);
      if (!catItems.length) return;
      const title = document.createElement('div');
      title.className = 'cat-section-title';
      title.textContent = cat;
      grid.appendChild(title);
      catItems.forEach(item => grid.appendChild(makeCard(item)));
    });
  } else {
    items.forEach(item => grid.appendChild(makeCard(item)));
  }
}

function makeCard(item) {
  const qty = cart[item.id] || 0;
  const div = document.createElement('div');
  div.className = 'menu-item' + (qty > 0 ? ' in-cart' : '');
  div.innerHTML = `
    <span class="item-emoji">${item.emoji}</span>
    <div class="item-name">${item.name}</div>
    <div class="item-price">Rs. ${item.price}</div>
    <div class="item-controls">
      ${qty > 0 ? `
        <button class="qty-btn minus" onclick="changeQty('${item.id}',-1,event)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn plus" onclick="changeQty('${item.id}',1,event)">+</button>
      ` : `
        <button class="qty-btn plus" style="width:100%;border-radius:8px;" onclick="changeQty('${item.id}',1,event)">+ Add</button>
      `}
    </div>
  `;
  return div;
}

function changeQty(id, delta, e) {
  e.stopPropagation();
  const cur = cart[id] || 0;
  const next = cur + delta;
  if (next <= 0) delete cart[id];
  else cart[id] = next;
  updateCartCount();
  renderMenu();
  if (Object.keys(cart).length > 0) renderCartDrawer();
}

function updateCartCount() {
  const total = Object.values(cart).reduce((s,v) => s+v, 0);
  const el = document.getElementById('cartCount');
  if (total > 0) { el.style.display='flex'; el.textContent=total; }
  else el.style.display='none';
}

function renderCartDrawer() {
  const items = Object.entries(cart).map(([id, qty]) => {
    const item = GV.menu.find(m => m.id === id);
    return { ...item, qty };
  });
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);

  document.getElementById('drawerTitle').textContent = `Order — Table ${selectedTable}`;
  document.getElementById('cartTotal').textContent = GV.fmtPrice(total);

  const body = document.getElementById('cartBody');
  if (!items.length) {
    body.innerHTML = '<p style="text-align:center;color:var(--muted);padding:24px;">Cart is empty</p>';
    return;
  }
  body.innerHTML = items.map(i => `
    <div class="cart-row">
      <div>
        <div class="cart-item-name">${i.emoji} ${i.name}</div>
        <div class="cart-item-meta">×${i.qty} · Rs.${i.price} each</div>
      </div>
      <div class="cart-item-price">Rs. ${i.price * i.qty}</div>
    </div>
  `).join('');
}

function openCart() {
  renderCartDrawer();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
}
function closeCart() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
}

function sendOrder() {
  const items = Object.entries(cart).map(([id, qty]) => {
    const item = GV.menu.find(m => m.id === id);
    return { id, name:item.name, price:item.price, emoji:item.emoji, qty };
  });
  if (!items.length) return;

  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  GV.addOrder({ table: selectedTable, items, total });

  cart = {};
  updateCartCount();
  closeCart();
  renderMenu();

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Init
buildTableGrid();
GV.onUpdate(() => buildTableGrid());
</script>
</body>
</html>
